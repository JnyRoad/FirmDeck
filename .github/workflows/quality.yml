name: quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-i18n:
    name: Static i18n governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-enterprise/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend-enterprise ci
      - name: Check catalogs and TypeScript sinks
        shell: bash
        run: |
          mkdir -p artifacts/i18n/frontend
          npm --prefix frontend-enterprise run i18n:check:frontend -- --format=json \
            2> artifacts/i18n/frontend/diagnostics.json
      - name: Check generated pseudo locale
        run: npm --prefix frontend-enterprise run i18n:check:pseudo
      - name: Upload frontend i18n diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-i18n-diagnostics
          path: artifacts/i18n/frontend
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-enterprise/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend-enterprise ci
      - name: Run frontend tests
        run: npm --prefix frontend-enterprise test
      - name: Build frontend
        run: npm --prefix frontend-enterprise run build

  backend-i18n:
    name: Backend i18n governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend contract dependencies
        run: python -m pip install --disable-pip-version-check -e "backend[dev]"
      - name: Check backend public text boundaries
        shell: bash
        run: |
          mkdir -p artifacts/i18n/backend
          python scripts/i18n/check_python.py --format=json \
            2> artifacts/i18n/backend/diagnostics.json
      - name: Check generated backend i18n contract
        run: python scripts/i18n/export_contract.py --check
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Lint backend i18n contracts
        run: >-
          python -m ruff check
          backend/app/contracts
          backend/app/i18n
          backend/app/llm/prompts/language.py
          backend/app/observability/product_events.py
          scripts/i18n
          backend/tests/test_i18n_checker.py
          backend/tests/test_i18n_ci_contract.py
          backend/tests/test_i18n_contract_export.py
          backend/tests/test_i18n_contract_schema_migration.py
          backend/tests/test_i18n_product_events.py
          backend/tests/test_language_context.py
          backend/tests/test_error_contracts.py
          backend/tests/test_event_contracts.py
      - name: Upload backend i18n diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-i18n-diagnostics
          path: artifacts/i18n/backend
          if-no-files-found: ignore

  browser:
    name: Browser i18n matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-enterprise/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend-enterprise ci
      - name: Install Chromium
        run: npm --prefix frontend-enterprise exec -- playwright install --with-deps chromium
      - name: Run browser i18n matrix
        run: npm --prefix frontend-enterprise run test:e2e:i18n
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-i18n-diagnostics
          path: |
            frontend-enterprise/playwright-report
            frontend-enterprise/test-results
          if-no-files-found: ignore
